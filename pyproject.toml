[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exca-mcp"
version = "0.2.0"
description = "A local MCP server for creating and editing Excalidraw documents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.3.1,<4",
    "pillow>=13.0.0",
    "pygments>=2.20.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "starlette>=0.35.0",
    "uvicorn>=0.28.0",
]

[project.urls]
Repository = "https://github.com/Dharshan2208/excalidraw-mcp"
Issues = "https://github.com/Dharshan2208/excalidraw-mcp/issues"

[project.scripts]
exca-mcp = "excalidraw_mcp.server:main"
excalidraw-mcp = "excalidraw_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["excalidraw_mcp"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.venv*",
    "/audit_tests",
    "/.coverage",
    "/dist",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:websockets.legacy is deprecated:DeprecationWarning",
    "ignore:websockets.server.WebSocketServerProtocol is deprecated:DeprecationWarning",
    "ignore:remove second argument of ws_handler:DeprecationWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
