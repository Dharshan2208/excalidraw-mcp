[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exca-mcp"
version = "0.3.0"
description = "A local MCP server for creating and editing Excalidraw documents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Graphics :: Presentation",
]
keywords = [
    "excalidraw",
    "mcp",
    "model-context-protocol",
    "diagrams",
    "agent-skills",
    "fastmcp",
    "pytest"
]
dependencies = [
    "fastmcp>=3.3.1,<4",
    "pydantic>=2.0.0",
    "mcp>=1.2.0",
    "pillow>=13.0.0",
    "pygments>=2.20.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "starlette>=0.40.0",
    "uvicorn>=0.28.0",
]

[project.urls]
Homepage = "https://github.com/Dharshan2208/excalidraw-mcp"
Repository = "https://github.com/Dharshan2208/excalidraw-mcp"
Documentation = "https://github.com/Dharshan2208/excalidraw-mcp#readme"
Issues = "https://github.com/Dharshan2208/excalidraw-mcp/issues"
Changelog = "https://github.com/Dharshan2208/excalidraw-mcp/blob/main/CHANGELOG.md"

[project.scripts]
exca-mcp = "excalidraw_mcp.server:main"
excalidraw-mcp = "excalidraw_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["excalidraw_mcp"]

[tool.hatch.build.targets.wheel.force-include]
".skills" = "excalidraw_mcp/skills"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.venv*",
    "/audit_tests",
    "/.coverage",
    "/dist",
    "/research",
    "/.pytest_cache",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:websockets.legacy is deprecated:DeprecationWarning",
    "ignore:websockets.server.WebSocketServerProtocol is deprecated:DeprecationWarning",
    "ignore:remove second argument of ws_handler:DeprecationWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"excalidraw_mcp/server.py" = ["E402"]
"tests/*" = ["F401", "F841"]
